<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart FI Diagnostic Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 10px;
            line-height: 1.5;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid #334155; }
        .card h3 { margin: 0 0 10px 0; color: var(--subtext); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        .value { font-size: 2.2rem; font-weight: 800; margin: 5px 0; display: flex; align-items: baseline; gap: 5px; }
        .unit { font-size: 1rem; color: var(--subtext); font-weight: 400; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; margin-top: 10px; }
        .status-ok { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .status-warn { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .status-error { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px; 
            background: var(--card); 
            border-radius: 16px; 
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .logo span { color: var(--text); }
        
        select { 
            background: #0f172a; 
            color: white; 
            padding: 8px 16px; 
            border-radius: 8px; 
            border: 1px solid #334155; 
            outline: none;
            cursor: pointer;
        }
        
        .diag-item { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            padding: 12px; 
            border-radius: 12px; 
            background: #0f172a; 
            margin-bottom: 10px;
            border-left: 4px solid var(--success);
        }
        .diag-item.warn { border-left-color: var(--warning); }
        .diag-item.error { border-left-color: var(--danger); }
        
        .chart-container { height: 250px; width: 100%; margin-top: 10px; }
        
        @media (max-width: 640px) {
            header { flex-direction: column; gap: 15px; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">⚡ Smart<span>FI Diag</span></div>
            <div>
                <select id="vehicleProfile" onchange="changeProfile()">
                    <option value="model_honda_beat_2014">Honda Beat FI 2014</option>
                    <option value="model_yamaha_mio_z">Yamaha Mio Z</option>
                </select>
            </div>
        </header>

        <div class="grid">
            <div class="card">
                <h3>Battery Voltage</h3>
                <div class="value" id="valBatt">-- <span class="unit">V</span></div>
                <span class="status-badge status-ok" id="statBatt">Sistem Normal</span>
            </div>
            <div class="card">
                <h3>Engine RPM</h3>
                <div class="value" id="valRPM">-- <span class="unit">RPM</span></div>
                <span class="status-badge status-ok" id="statRPM">Stasioner</span>
            </div>
            <div class="card">
                <h3>TPS Position</h3>
                <div class="value" id="valTPS">-- <span class="unit">%</span></div>
                <div id="valTPS_v" style="color:var(--subtext); font-size: 0.8rem;">0.00 V</div>
            </div>
            <div class="card">
                <h3>Engine Temp</h3>
                <div class="value" id="valTemp">-- <span class="unit">°C</span></div>
                <span class="status-badge status-ok" id="statTemp">Suhu Kerja</span>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 15px; margin-bottom: 20px;" class="grid-main">
            <div class="card">
                <h3>Hasil Diagnosa Live</h3>
                <div id="diagList">
                    <div class="diag-item">
                        <span>✅ Menunggu data dari ESP32...</span>
                    </div>
                </div>
            </div>
            <div class="card">
                <h3>Telemetri (RPM vs TPS)</h3>
                <div class="chart-container">
                    <canvas id="liveChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws;
        const chartCtx = document.getElementById('liveChart').getContext('2d');
        const liveChart = new Chart(chartCtx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { 
                        label: 'RPM', 
                        data: [], 
                        borderColor: '#2563eb', 
                        backgroundColor: 'rgba(37, 99, 235, 0.1)',
                        fill: true,
                        tension: 0.4, 
                        yAxisID: 'y',
                        pointRadius: 0
                    },
                    { 
                        label: 'TPS %', 
                        data: [], 
                        borderColor: '#22c55e', 
                        tension: 0.4, 
                        yAxisID: 'y1',
                        pointRadius: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: true, labels: { color: '#94a3b8' } } },
                scales: {
                    x: { display: false },
                    y: { 
                        type: 'linear', 
                        display: true, 
                        position: 'left', 
                        min: 0, 
                        max: 10000,
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' }
                    },
                    y1: { 
                        type: 'linear', 
                        display: true, 
                        position: 'right', 
                        min: 0, 
                        max: 100, 
                        grid: { drawOnChartArea: false },
                        ticks: { color: '#94a3b8' }
                    }
                }
            }
        });

        function connectWS() {
            ws = new WebSocket(`ws://${window.location.hostname}/ws`);
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    updateUI(data);
                } catch (e) { console.error("JSON Error", e); }
            };
            ws.onerror = (err) => console.error("WS Error", err);
            ws.onclose = () => setTimeout(connectWS, 2000);
        }

        function updateUI(data) {
            document.getElementById('valBatt').innerHTML = `${data.batt.toFixed(2)} <span class="unit">V</span>`;
            document.getElementById('valRPM').innerHTML = `${data.rpm.toFixed(0)} <span class="unit">RPM</span>`;
            document.getElementById('valTPS').innerHTML = `${data.tps_pct.toFixed(0)} <span class="unit">%</span>`;
            document.getElementById('valTemp').innerHTML = `${data.temp.toFixed(1)} <span class="unit">°C</span>`;
            
            // Logic status sederhana
            const statBatt = document.getElementById('statBatt');
            if (data.batt < 12.0) {
                statBatt.innerText = "Aki Lemah";
                statBatt.className = "status-badge status-warn";
            } else {
                statBatt.innerText = "Sistem Normal";
                statBatt.className = "status-badge status-ok";
            }

            // Update Chart
            if (liveChart.data.labels.length > 50) {
                liveChart.data.labels.shift();
                liveChart.data.datasets[0].data.shift();
                liveChart.data.datasets[1].data.shift();
            }
            liveChart.data.labels.push("");
            liveChart.data.datasets[0].data.push(data.rpm);
            liveChart.data.datasets[1].data.push(data.tps_pct);
            liveChart.update('none');
        }

        function changeProfile() {
            const profile = document.getElementById('vehicleProfile').value;
            fetch(`/api/profile?set=${profile}`, { method: 'POST' });
        }

        // Jalankan koneksi saat halaman siap
        window.onload = connectWS;
    </script>
</body>
</html>
